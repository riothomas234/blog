      <!-- ══ HOW TO ADD A POST ══════════════════════════════
           1. Create p/your-slug.html (copy an existing post file).
           2. Copy one .post-row block below, change the date,
              href and title, and put it at the TOP of the right
              year group.
           3. If it's one of the newest posts, add the same block
              to the "Recent posts" list in index.html too.

           <div class="post-row">
             <span class="post-date">Mon DD</span>
             <a class="post-title" href="p/your-slug.html">Your Post Title</a>
             <span class="post-tag">tag</span>
           </div>
           ═══════════════════════════════════════════════════ -->
